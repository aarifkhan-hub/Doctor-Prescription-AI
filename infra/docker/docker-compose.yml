version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db

  ai:
    build: ../../apps/ai-service
    env_file: ../../apps/ai-service/.env
    ports: ["8000:8000"]
    restart: unless-stopped

  backend:
    build: ../../apps/backend
    env_file: ../../apps/backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/doctor_prescription_ai
      AI_SERVICE_URL: http://ai:8000
    ports: ["5000:5000"]
    depends_on: [mongo, ai]
    restart: unless-stopped

  frontend:
    build: ../../apps/frontend
    ports: ["3000:80"]
    depends_on: [backend]
    restart: unless-stopped

volumes:
  mongo_data:
