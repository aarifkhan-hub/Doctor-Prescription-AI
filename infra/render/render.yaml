services:
  - type: web
    name: dprai-backend
    env: node
    plan: starter
    rootDir: apps/backend
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_SERVICE_TOKEN
        sync: false
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: dprai-ai
    env: docker
    plan: standard
    rootDir: apps/ai-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: SERVICE_TOKEN
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: OCR_MODEL_ID
        value: microsoft/trocr-base-handwritten
      - key: NER_MODEL_ID
        value: d4data/biomedical-ner-all
      - key: TRANSLATE_MODEL_ID
        value: Helsinki-NLP/opus-mt-en-hi
      - key: DEVICE
        value: cpu
